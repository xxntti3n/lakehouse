[normalize]
autodetect_primitive_types = true

[load]
batch_size = 1000

[sources.pg_replication]
slot_name = "dlt_replication_slot"
pub_name = "dlt_publication"
flush_slot = true
target_batch_size = 100

[destination.filesystem]
bucket_url = "s3://iceberg-data/cdc"

# Iceberg table format settings
# Note: Iceberg uses Parquet format automatically when table_format="iceberg" is set in resource decorator
