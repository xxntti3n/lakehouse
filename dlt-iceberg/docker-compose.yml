services:
  # DLT Bucket Creator
  dlt-bucket-creator:
    image: quay.io/minio/mc:latest
    container_name: dlt-bucket-creator
    environment:
      - MC_HOST_minio=http://minio:9000
    entrypoint: ["/bin/sh","/scripts/create-dlt-bucket.sh"]
    volumes:
      - ./scripts/create-dlt-bucket.sh:/scripts/create-dlt-bucket.sh:ro
    networks:
      - lakehouse

  # DLT Pipeline Service
  dlt-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dlt-pipeline
    depends_on:
      dlt-bucket-creator:
        condition: service_completed_successfully
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpw
      - MYSQL_DATABASE=appdb
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123
      - S3_BUCKET=dlt-warehouse
      - AWS_REGION=us-east-1
      # DLT filesystem destination configuration
      - DESTINATION__FILESYSTEM__BUCKET_URL=s3://dlt-warehouse
      - DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID=minio
      - DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY=minio123
      - DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL=http://minio:9000
      - DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME=us-east-1
      # Disable SSL for MinIO HTTP endpoint
      - 'DESTINATION__FILESYSTEM__KWARGS={"use_ssl": false}'
      - 'DESTINATION__FILESYSTEM__CLIENT_KWARGS={"verify": false, "endpoint_url": "http://minio:9000"}'
      # AWS credentials (for compatibility)
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_S3_ALLOW_HTTP=true
      - AWS_S3_ADDRESSING_STYLE=path
    restart: "no"
    networks:
      - lakehouse
    volumes:
      - dlt-data:/app/.dlt

# Use external network from flink_iceberg
networks:
  lakehouse:
    external: true
    name: flink_iceberg_default

volumes:
  dlt-data:
