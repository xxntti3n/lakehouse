version: '3.8'

services:
  # MySQL - Source database
  mysql:
    image: mysql:8.0
    container_name: mysql-source
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: appdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infrastructure/my.cnf:/etc/mysql/conf.d/gtid.cnf
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: minio-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DuckDB UI - Data exploration
  duckdb-ui:
    build:
      context: .
      dockerfile: Dockerfile.duckdb
    container_name: duckdb-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: dlt-warehouse
    volumes:
      - ./duckdb-ui:/app/duckdb-ui:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - pipeline_logs:/logs
    networks:
      - lakehouse
    depends_on:
      - minio

  # DLT Pipeline Cron Job - Runs every 2 minutes
  dlt-cron:
    image: mysql-iceberg-pipeline
    container_name: dlt-cron-job
    restart: unless-stopped
    command: >
      sh -c "
      echo 'Starting DLT Cron Scheduler with GTID tracking - Runs every 2 minutes' &&
      while true; do
        echo '===== Running DLT Pipeline at '$$(date)' =====' &&
        python run_pipeline_with_gtid.py 2>&1 | tee /logs/pipeline.log &&
        echo 'Pipeline completed. Next run in 2 minutes...' &&
        sleep 120
      done
      "
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpw
      MYSQL_DATABASE: appdb
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: dlt-warehouse
    volumes:
      - ./run_pipeline_with_gtid.py:/app/run_pipeline_with_gtid.py:ro
      - pipeline_logs:/logs
    networks:
      - lakehouse
    depends_on:
      - mysql
      - minio

  # Random Data Generator - Runs every 1 minute
  data-generator:
    image: mysql-iceberg-pipeline
    container_name: mysql-data-generator
    restart: unless-stopped
    command: >
      sh -c "
      echo 'Starting Random Data Generator - Runs every 1 minute' &&
      pip install pymysql -q &&
      while true; do
        echo '===== Generating Random Data at '$$(date)' =====' &&
        python /app/random_data_generator.py &&
        echo 'Data generation completed. Next run in 1 minute...' &&
        sleep 60
      done
      "
    volumes:
      - ./random_data_generator.py:/app/random_data_generator.py:ro
    networks:
      - lakehouse
    depends_on:
      - mysql

volumes:
  mysql_data:
  minio_data:
  pipeline_logs:

networks:
  lakehouse:
    external: true
    name: lakehouse_default
