# Minimal by default: mysql + minio + nessie + cdc + data-generator (~1.5GB RAM).
# Add StarRocks: --profile analytics
# Add DuckDB UI: --profile duckdb
# Full stack: --profile analytics
#
# NOTE: Nessie is now enabled by default for native Iceberg format support
services:
  # Nessie - Iceberg REST Catalog (enabled by default)
  nessie:
    image: ghcr.io/projectnessie/nessie:0.107.2-java
    container_name: nessie-catalog
    restart: unless-stopped
    ports:
      - "19120:19120"
    environment:
      QUARKUS_HTTP_PORT: 19120
      NESSIE_VERSION_STORE_TYPE: IN_MEMORY
      JAVA_OPTS: "-Xmx128m -Xms64m"
      # Iceberg REST catalog configuration
      NESSIE_SERVER_DEFAULT_BRANCH: main
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: s3://dlt-warehouse
      NESSIE_CATALOG_SERVICE_ENABLED: "true"
    volumes:
      - ./nessie/conf:/etc/nessie:ro
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 64M }

  # MySQL - Source (minimal)
  mysql:
    image: mysql:8.0
    container_name: mysql-source
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: appdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infrastructure/my.cnf:/etc/mysql/conf.d/gtid.cnf
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpw"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 128M }

  # MinIO - S3 storage (minimal)
  minio:
    image: minio/minio:latest
    container_name: minio-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data
      - ./infrastructure/setup-checkpoints.sh:/setup-checkpoints.sh:ro
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 64M }

  # DuckDB UI - use --profile duckdb
  duckdb-ui:
    build:
      context: .
      dockerfile: Dockerfile.duckdb
    container_name: duckdb-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: dlt-warehouse
    volumes:
      - ./duckdb-ui:/app/duckdb-ui:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - pipeline_logs:/logs
    networks:
      - lakehouse
    depends_on:
      - minio
    deploy:
      resources:
        limits: { memory: 256M }
    profiles:
      - duckdb

  # Debezium DLT Connector - CDC with native Iceberg support
  debezium-cdc:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: mysql-iceberg-pipeline
    container_name: debezium-dlt-connector
    restart: unless-stopped
    command: >
      sh -c "
      echo 'Starting Debezium DLT Connector - Native Iceberg Pipeline' &&
      echo 'This will:' &&
      echo '  1. Snapshot initial data' &&
      echo '  2. Stream binlog changes' &&
      echo '  3. Write to Iceberg via Nessie catalog' &&
      echo '  4. Store data in MinIO (s3://dlt-warehouse/iceberg)' &&
      echo '  5. Repeat every 5 minutes' &&
      echo '' &&
      echo 'Nessie Iceberg Catalog: http://nessie:19120/iceberg' &&
      echo 'Warehouse: s3://dlt-warehouse/iceberg' &&
      echo '' &&
      while true; do
        echo '===== CDC Run at '$$(date)' =====' &&
        python run_debezium_dlt.py &&
        EXIT_CODE=$$? &&
        if [ $$EXIT_CODE -eq 0 ]; then
          echo '✅ CDC run completed successfully. Next run in 5 minutes...' &&
          sleep 300
        else
          echo '❌ CDC run failed with code '$$EXIT_CODE'. Retrying in 1 minute...' &&
          sleep 60
        fi
      done
      "
    environment:
      # MySQL configuration
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpw
      MYSQL_DATABASE: appdb

      # S3/MinIO configuration
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      AWS_REGION: us-east-1

      # Nessie/Iceberg configuration
      NESSIE_URI: http://nessie:19120/api/v2
      NESSIE_REF: main
      NESSIE_ICEBERG_URI: http://nessie:19120/iceberg
      ICEBERG_WAREHOUSE: s3://dlt-warehouse/iceberg
      ICEBERG_NAMESPACE: appdb
      ICEBERG_REST_URI: http://nessie:19120/iceberg/v1

      # Pipeline configuration
      SNAPSHOT_MODE: initial
      STREAMING_BATCH_SIZE: 1000
      STREAMING_MAX_EVENTS: 10000
      TABLE_INCLUDE_LIST: appdb.products,appdb.sales
      DEST_BUCKET: dlt-warehouse
      DATASET_NAME: debezium_cdc
    volumes:
      - ./run_iceberg_pipeline.py:/app/run_iceberg_pipeline.py:ro
      - ./run_debezium_dlt.py:/app/run_debezium_dlt.py:ro
      - ./debezium_dlt:/app/debezium_dlt:ro
      - ./scripts:/app/scripts:ro
      - pipeline_logs:/logs
    networks:
      - lakehouse
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  # Data generator (optional for minimal; leave in for demo)
  data-generator:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: mysql-iceberg-pipeline
    container_name: mysql-data-generator
    restart: unless-stopped
    command: >
      sh -c "
      echo 'Starting Random Data Generator - Runs every 1 minute' &&
      pip install pymysql -q &&
      while true; do
        echo '===== Generating Random Data at '$$(date)' =====' &&
        python /app/random_data_generator.py &&
        echo 'Data generation completed. Next run in 1 minute...' &&
        sleep 60
      done
      "
    volumes:
      - ./random_data_generator.py:/app/random_data_generator.py:ro
    networks:
      - lakehouse
    depends_on:
      - mysql
    deploy:
      resources:
        limits: { memory: 128M }

  # StarRocks FE - use --profile analytics
  starrocks-fe:
    image: starrocks/fe-ubuntu:3.2.6
    container_name: starrocks-fe
    hostname: starrocks-fe
    restart: unless-stopped
    ports:
      - "8030:8030"
      - "9020:9020"
      - "9030:9030"
    environment:
      TZ: UTC
    volumes:
      - starrocks_fe_data:/opt/starrocks/fe/meta
      - starrocks_fe_log:/opt/starrocks/fe/log
    command: ["/opt/starrocks/fe/bin/start_fe.sh"]
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits: { memory: 1G }
        reservations: { memory: 384M }
    profiles:
      - analytics

  # Register BE with FE
  starrocks-init:
    image: mysql:8.0
    container_name: starrocks-init
    restart: "no"
    command: >
      sh -c "
      echo 'Waiting for StarRocks FE...' &&
      for i in $$(seq 1 30); do
        if mysql -h starrocks-fe -P 9030 -u root -e 'SELECT 1' 2>/dev/null; then break; fi;
        sleep 2;
      done &&
      mysql -h starrocks-fe -P 9030 -u root -e \"ALTER SYSTEM ADD BACKEND 'starrocks-be:9050';\" &&
      echo 'Backend registered.' &&
      exit 0
      "
    networks:
      - lakehouse
    depends_on:
      starrocks-fe:
        condition: service_healthy
      starrocks-be:
        condition: service_started
    profiles:
      - analytics

  # StarRocks BE
  starrocks-be:
    image: starrocks/be-ubuntu:3.2.6
    container_name: starrocks-be
    hostname: starrocks-be
    restart: unless-stopped
    ports:
      - "8040:8040"
    environment:
      TZ: UTC
    volumes:
      - starrocks_be_data:/opt/starrocks/be/storage
      - starrocks_be_log:/opt/starrocks/be/log
      - ./infrastructure/starrocks-be-start.sh:/start-be.sh:ro
    depends_on:
      starrocks-fe:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/start-be.sh"]
    networks:
      - lakehouse
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }
    profiles:
      - analytics

  # Trino - SQL engine for Iceberg queries
  trino:
    image: trinodb/trino:472
    container_name: trino
    hostname: trino
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
    volumes:
      - ./trino/conf:/etc/trino/conf:ro
      - ./trino/catalog:/etc/trino/catalog:ro
      - trino_data:/data/trino
    networks:
      - lakehouse
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 3G }
        reservations: { memory: 2G }
    profiles:
      - trino

volumes:
  mysql_data:
  minio_data:
  pipeline_logs:
  starrocks_fe_data:
  starrocks_fe_log:
  starrocks_be_data:
  starrocks_be_log:
  trino_data:

networks:
  lakehouse:
    driver: bridge
