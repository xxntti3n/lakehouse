version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dlt-postgres
    environment:
      POSTGRES_DB: dlt_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dlt_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dlt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_DEFAULT_BUCKETS: iceberg-data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  dlt-pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.dlt-pipeline
    container_name: dlt-pipeline
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: dlt_data
      POSTGRES_USER: replication_user
      POSTGRES_PASSWORD: replication123
      MINIO_ENDPOINT: http://minio:9000
      ICEBERG_BUCKET: iceberg-data
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      SLOT_NAME: dlt_replication_slot
      PUB_NAME: dlt_publication
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./pipeline:/app
      - dlt_data:/app/data
      - dlt_logs:/app/logs

volumes:
  postgres_data:
  minio_data:
  dlt_data:
  dlt_logs:
