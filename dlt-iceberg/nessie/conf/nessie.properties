# Nessie Iceberg Catalog Configuration
# See: https://projectnessie.org/nessie-latest/configuration/

# Default branch
nessie.server.default-branch=main

# Iceberg REST catalog service
nessie.catalog.service.enabled=true

# Default warehouse location
nessie.catalog.default-warehouse=s3://dlt-warehouse

# S3 configuration for the warehouse
nessie.catalog.warehouses.s3://dlt-warehouse.s3.endpoint=http://minio:9000
nessie.catalog.warehouses.s3://dlt-warehouse.s3.path-style-access=true
nessie.catalog.warehouses.s3://dlt-warehouse.s3.access-key-id=minio
nessie.catalog.warehouses.s3://dlt-warehouse.s3.secret-access-key=minio123
