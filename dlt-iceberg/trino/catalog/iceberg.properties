# Iceberg connector with Nessie REST catalog
# Configuration based on https://projectnessie.org/iceberg/trino/

connector.name=iceberg
iceberg.catalog.type=rest

# Nessie REST catalog configuration
iceberg.rest-catalog.uri=http://nessie-catalog:19120/iceberg
iceberg.rest-catalog.prefix=main

# S3 configuration for MinIO
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.aws-access-key=minio
s3.aws-secret-key=minio123
s3.path-style-access=true
