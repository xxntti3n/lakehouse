# Direct S3/MinIO access for querying Iceberg tables without Nessie
connector.name=iceberg

# Use REST catalog with direct file system access
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://nessie:19120/iceberg/v1
iceberg.rest-catalog.warehouse=s3://dlt-warehouse

# S3 configuration for MinIO
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.aws-access-key=minio
s3.aws-secret-key=minio123
s3.region=us-east-1
