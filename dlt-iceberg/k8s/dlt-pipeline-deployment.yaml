---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dlt-pipeline-config
  namespace: dlt-iceberg
data:
  # PostgreSQL configuration
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "dlt_data"
  POSTGRES_USER: "replication_user"

  # MinIO/S3 configuration
  MINIO_ENDPOINT: "http://minio:9000"
  ICEBERG_BUCKET: "iceberg-data"

  # Replication configuration
  SLOT_NAME: "dlt_replication_slot"
  PUB_NAME: "dlt_publication"

---
apiVersion: v1
kind: Secret
metadata:
  name: dlt-pipeline-secret
  namespace: dlt-iceberg
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replication123"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlt-pipeline
  namespace: dlt-iceberg
  labels:
    app: dlt-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dlt-pipeline
  template:
    metadata:
      labels:
        app: dlt-pipeline
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z postgres 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready"
      - name: wait-for-minio
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z minio 9000; do
            echo "Waiting for MinIO..."
            sleep 2
          done
          echo "MinIO is ready"

      containers:
      - name: dlt-pipeline
        image: dlt-iceberg-pipeline:latest
        imagePullPolicy: IfNotPresent
        env:
        # PostgreSQL configuration
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: dlt-pipeline-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: dlt-pipeline-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: dlt-pipeline-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: dlt-pipeline-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dlt-pipeline-secret
              key: POSTGRES_PASSWORD

        # MinIO/S3 configuration
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: dlt-pipeline-config
              key: MINIO_ENDPOINT
        - name: ICEBERG_BUCKET
          valueFrom:
            configMapKeyRef:
              name: dlt-pipeline-config
              key: ICEBERG_BUCKET
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: dlt-pipeline-secret
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dlt-pipeline-secret
              key: MINIO_SECRET_KEY

        # Replication configuration
        - name: SLOT_NAME
          valueFrom:
            configMapKeyRef:
              name: dlt-pipeline-config
              key: SLOT_NAME
        - name: PUB_NAME
          valueFrom:
            configMapKeyRef:
              name: dlt-pipeline-config
              key: PUB_NAME

        # DLT-specific environment variables
        - name: DLT_PROJECT_DIR
          value: /app
        - name: DLT_SECRETS_LOCATION
          value: /app/.dlt
        - name: PYTHONUNBUFFERED
          value: "1"

        # Logging
        - name: LOG_LEVEL
          value: INFO

        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        volumeMounts:
        - name: dlt-data
          mountPath: /app/data
        - name: dlt-logs
          mountPath: /app/logs

      volumes:
      - name: dlt-data
        emptyDir: {}
      - name: dlt-logs
        emptyDir: {}

      restartPolicy: Always
