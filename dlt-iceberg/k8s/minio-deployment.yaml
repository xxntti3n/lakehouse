---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-config
  namespace: dlt-iceberg
data:
  MINIO_ROOT_USER: minioadmin
  MINIO_DEFAULT_BUCKETS: iceberg-data,dlt-pipelines

---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: dlt-iceberg
type: Opaque
stringData:
  MINIO_ROOT_PASSWORD: minioadmin123

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: dlt-iceberg
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            configMapKeyRef:
              name: minio-config
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_PASSWORD
        - name: MINIO_DEFAULT_BUCKETS
          valueFrom:
            configMapKeyRef:
              name: minio-config
              key: MINIO_DEFAULT_BUCKETS
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: dlt-iceberg
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    name: api
  - port: 9001
    targetPort: 9001
    name: console
  selector:
    app: minio
