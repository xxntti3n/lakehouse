---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: dlt-iceberg
data:
  POSTGRES_DB: dlt_data
  POSTGRES_USER: postgres
  # Enable replication
  POSTGRES_HOST_AUTH_METHOD: scram-sha-256

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: dlt-iceberg
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres123
  REPLICATION_USER: replication_user
  REPLICATION_PASSWORD: replication123

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dlt-iceberg
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST_AUTH_METHOD
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_HOST_AUTH_METHOD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: postgres-data
        emptyDir: {}
      - name: init-scripts
        configMap:
          name: postgres-init-scripts

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dlt-iceberg
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: postgres

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: dlt-iceberg
data:
  01-init-replication.sh: |
    #!/bin/bash
    set -e

    # Create replication user
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE ROLE replication_user WITH LOGIN REPLICATION PASSWORD 'replication123';
    EOSQL

    # Grant necessary permissions
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        GRANT CREATE ON DATABASE dlt_data TO replication_user;
        GRANT CONNECT ON DATABASE dlt_data TO replication_user;
        GRANT USAGE ON SCHEMA public TO replication_user;
    EOSQL

    # Create sample tables for testing
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        -- Create sample table with timestamps
        CREATE TABLE IF NOT EXISTS users (
            id SERIAL PRIMARY KEY,
            username VARCHAR(255) NOT NULL,
            email VARCHAR(255) NOT NULL,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        );

        -- Create another sample table
        CREATE TABLE IF NOT EXISTS orders (
            id SERIAL PRIMARY KEY,
            user_id INTEGER REFERENCES users(id),
            amount DECIMAL(10, 2),
            status VARCHAR(50),
            order_date DATE DEFAULT CURRENT_DATE
        );

        -- Insert sample data
        INSERT INTO users (username, email) VALUES
            ('john_doe', 'john@example.com'),
            ('jane_smith', 'jane@example.com'),
            ('bob_wilson', 'bob@example.com');

        INSERT INTO orders (user_id, amount, status) VALUES
            (1, 100.50, 'completed'),
            (2, 250.00, 'pending'),
            (3, 75.25, 'shipped');

        GRANT SELECT ON ALL TABLES IN SCHEMA public TO replication_user;
    EOSQL

    echo "Replication user and sample tables created successfully"
