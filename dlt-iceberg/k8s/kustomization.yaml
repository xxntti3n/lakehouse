apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dlt-iceberg

# Resources to deploy
resources:
  - namespace.yaml
  - postgres-deployment.yaml
  - minio-deployment.yaml
  - dlt-pipeline-deployment.yaml

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: dlt-iceberg
  app.kubernetes.io/instance: dlt-iceberg-production
  app.kubernetes.io/managed-by: kubectl
  app.kubernetes.io/component: data-lakehouse

# ConfigMap generator
configMapGenerator:
  - name: dlt-iceberg-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO

# Secret generator (for development - use proper secrets in production)
secretGenerator:
  - name: dlt-iceberg-secrets
    literals:
      - POSTGRES_PASSWORD=postgres123
      - REPLICATION_PASSWORD=replication123
      - MINIO_SECRET_KEY=minioadmin123
