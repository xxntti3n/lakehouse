# StarRocks Frontend Configuration
# Basic configuration for Ranger integration

# Service configuration
SERVICE_TYPE = fe
HTTP_PORT = 8030
QUERY_PORT = 9030
THRIFT_SERVER_PORT = 9020
EDIT_LOG_PORT = 9010
MYSQL_SERVICE_PORT = 9030

# Cluster configuration
CLUSTER_NAME = starrocks_ranger_cluster

# Storage configuration
RUNALL_META_DIR = /opt/starrocks/fe/meta
RUNALL_LOG_DIR = /opt/starrocks/fe/log

# Ranger plugin configuration
PLUGIN_ENABLE = true
PLUGIN_DIR = /opt/starrocks/fe/ranger-plugin

# Java configuration
JAVA_OPTS = "-Dlog4j2.formatMsgNoLookups=true -Xmx8g -XX:+UseMembar -XX:SurvivorRatio=8 -XX:MaxTenuringThreshold=7"

# MySQL service configuration
MYSQL_SERVICE_NIO_ENABLED = true
