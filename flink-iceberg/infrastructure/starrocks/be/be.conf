# StarRocks Backend Configuration
# Basic configuration for Ranger integration

# Service configuration
be_port = 9060
THRIFT_SERVER_PORT = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

# Cluster configuration
CLUSTER_NAME = starrocks_ranger_cluster

# Storage configuration
RUNALL_STORAGE_DIR = /opt/starrocks/be/storage
RUNALL_LOG_DIR = /opt/starrocks/be/log

# Buffer pool configuration
buffer_pool_limit = 20GB

# Mem configuration
mem_limit = 80%

# Java configuration
JAVA_OPTS = "-Dlog4j2.formatMsgNoLookups=true -Xmx8g -XX:+UseMembar -XX:SurvivorRatio=8 -XX:MaxTenuringThreshold=7"
